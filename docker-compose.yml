# Local development: only PostgreSQL runs in Docker.
# The server (npm run dev in ./server) and the web app (npm run dev in ./web)
# run directly on the host.
name: rara-dev

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: rara
      POSTGRES_USER: rara
      POSTGRES_PASSWORD: rara
    ports:
      - "5435:5432"
    volumes:
      - rara_pg_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rara -d rara"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rara_pg_dev:
